<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Carlos Ghosn: Stay or Escape?</title>
  <meta name="theme-color" content="#FAF8F5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="student.css">
</head>
<body>
  <div class="game-container" id="app">
    <!-- MINIMAL CLEAN TOP PROGRESS -->
    <header class="minimal-header" id="minimalHeader">
      <div class="progress-bar-container">
        <div class="progress-segment active" data-level="1"></div>
        <div class="progress-segment" data-level="2"></div>
        <div class="progress-segment" data-level="3"></div>
        <div class="progress-segment" data-level="4"></div>
        <div class="progress-segment" data-level="5"></div>
      </div>
      <div class="level-indicator" id="levelIndicator">Level 1 of 5</div>
    </header>

    <!-- MAIN SCENE CARD -->
    <main class="main-content" id="mainContent">
      <section class="story-card" id="storyCard">
        <!-- Injected dynamically via student.js -->
      </section>

      <!-- CLEAN END SCREEN (POST LEVEL 5) -->
      <section class="end-card" id="endCard" style="display: none;">
        <!-- Injected dynamically via student.js -->
      </section>
    </main>

    <!-- 3D TRANSITION ANIMATION OVERLAY -->
    <div class="animation-overlay" id="animationOverlay">
      <!-- 3D Animation stage populated dynamically: Stay House vs Escape Aeroplane -->
      <div class="animation-stage" id="animationStage"></div>
    </div>
  </div>

  <!-- Real-time Synchronization -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="student.js"></script>
</body>
</html>
